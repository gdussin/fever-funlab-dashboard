<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fever × Funlab Delivery Readiness · V13</title><style>
:root{--ink:#111;--paper:#fbf8f0;--pink:#ff2c8b;--blue:#2e59f5;--lime:#c8ff00;--yellow:#ffd400;--red:#f33543;--green:#00a983}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.45 Arial,sans-serif;color:var(--ink)}main{max-width:1420px;margin:auto;padding:24px}.hero{background:#111;color:#fff;border-radius:22px;padding:28px;display:flex;justify-content:space-between;align-items:end}.hero h1{font-size:clamp(34px,5vw,64px);line-height:.95;margin:8px 0}.eyebrow{color:var(--lime);font-weight:900;letter-spacing:.13em}.meta{color:#ddd}.box{background:#fff;border:2px solid #111;border-radius:18px;padding:20px;margin-top:18px;box-shadow:6px 6px #111}h2{font-size:24px;line-height:1.15;margin:0 0 8px}h3{font-size:17px;margin:22px 0 10px}.sub{color:#555;margin:0 0 16px}.kpis,.milestones{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.milestones{grid-template-columns:repeat(3,1fr)}.kpi,.mile{border:2px solid #111;border-radius:14px;padding:16px}.kpi b{display:block;font-size:32px}.mile h2{font-size:28px}.risk{display:inline-block;border-radius:999px;padding:5px 10px;font-weight:900;background:var(--yellow)}.progress{height:15px;background:#eee;border:2px solid #111;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mini div{text-align:center;background:#f3f3f3;border-radius:10px;padding:8px}.mini b{display:block;font-size:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{border:2px solid #111;border-radius:999px;background:#fff;padding:7px 12px;font-weight:800;cursor:pointer}.chip.on{background:var(--pink);color:#fff}.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:165px 1fr 40px;gap:10px;align-items:center}.track{height:17px;border:2px solid #111;border-radius:20px;background:#eee;overflow:hidden}.fill{height:100%;background:var(--blue)}table{width:100%;border-collapse:separate;border-spacing:7px}th{text-align:left;font-size:12px;text-transform:uppercase}td{border:2px solid #111;border-radius:9px;padding:10px}.heat td{text-align:center;font-weight:900}.error{background:#fff0f0;border-color:var(--red)}a{color:var(--blue)}@media(max-width:850px){.kpis{grid-template-columns:1fr 1fr}.milestones,.two{grid-template-columns:1fr}}@media(max-width:520px){main{padding:10px}.kpis{grid-template-columns:1fr}.bar{grid-template-columns:95px 1fr 28px}}
</style></head><body><main><section class="hero"><div><div class="eyebrow">FUNLAB × FEVER</div><h1>DELIVERY<br>READINESS</h1><div class="meta">Product roadmap · Version 13</div></div><div id="updated">Connecting to JSON…</div></section><div id="app"><section class="box">Loading current-board.json…</section></div></main><script>
const DATA_URL='./current-board.json';const DONE=['5. Live','6. Verified & Communicated'];const WEIGHT={'1. Incoming':0,'2. To Review':10,'3. Backlog':25,'4. In Progress':60,'5. Live':90,'6. Verified & Communicated':100};let cards=[],typeFilter=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function labs(c,p){return(c.labels||[]).map(x=>x.name||'').filter(x=>x.startsWith(p+' |')).map(x=>x.split('|').slice(1).join('|').trim())}function normType(x){x=String(x||'');if(/hyper.?care/i.test(x))return'HyperCare';if(/^bug$/i.test(x))return'Bug';if(/feature/i.test(x))return'Feature';if(/optimi[sz]ation/i.test(x))return'Optimization';return'Missing'}
function priority(c){const names=(c.labels||[]).map(x=>x.name||'').join(' ');const m=names.match(/Critical|High|Medium|Low/i);return m?m[0][0].toUpperCase()+m[0].slice(1).toLowerCase():'Missing'}
function mapData(d){const lists=Object.fromEntries((d.lists||[]).map(x=>[x.id,x.name]));return(d.cards||[]).filter(c=>!c.closed).map(c=>({name:c.name,url:c.url||c.shortUrl||'#',status:lists[c.idList]||'Unknown',milestone:labs(c,'M'),stream:labs(c,'S'),type:(()=>{let a=labs(c,'T').map(normType);return a.length?[...new Set(a)]:['Missing']})(),priority:priority(c),owners:c.idMembers||[]}))}
const open=c=>!DONE.includes(c.status),bau=c=>!c.milestone.length,inM=(c,m)=>m==='BAU'?bau(c):c.milestone.some(x=>x.toUpperCase().includes(m));
function chips(){return'<div class="chips">'+['All','HyperCare','Bug','Feature','Optimization'].map(x=>`<button class="chip ${(x==='All'&&!typeFilter.length)||typeFilter.includes(x)?'on':''}" onclick="toggleType('${x}')">${x}</button>`).join('')+'</div>'}function toggleType(x){if(x==='All')typeFilter=[];else typeFilter.includes(x)?typeFilter=typeFilter.filter(v=>v!==x):typeFilter.push(x);render()}
function bars(vals,color='#2e59f5'){let c={};vals.forEach(x=>c[x]=(c[x]||0)+1);let a=Object.entries(c).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...a.map(x=>x[1]));return'<div class="bars">'+a.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/max*100}%;background:${color}"></div></div><b>${v}</b></div>`).join('')+'</div>'}
function milestone(m){let a=cards.filter(c=>inM(c,m)),o=a.filter(open),progress=a.length?Math.round(a.reduce((n,c)=>n+(WEIGHT[c.status]??0),0)/a.length):0,crit=o.filter(c=>c.priority==='Critical').length,hc=o.filter(c=>c.type.includes('HyperCare')).length,risk=crit>=8?'HIGH RISK':crit>=3?'WATCH':'LOW RISK';return`<article class="mile"><h2>${m}</h2><span class="risk">${risk}</span><h3>${progress}% progress</h3><div class="progress"><i style="width:${progress}%"></i></div><div class="mini"><div><b>${a.length}</b>Total</div><div><b>${o.length}</b>Remaining</div><div><b>${crit}</b>Critical</div></div><div class="mini"><div><b>${hc}</b>HyperCare</div></div></article>`}
function render(){const o=cards.filter(open),ms=['AU','USA','BAU'],types=['HyperCare','Bug','Feature','Optimization'],filtered=o.filter(c=>!typeFilter.length||c.type.some(t=>typeFilter.includes(t))),missing=cards.filter(c=>!c.milestone.length||!c.stream.length||c.type.includes('Missing')||c.priority==='Missing'||!c.owners.length);document.getElementById('app').innerHTML=`<section class="box"><div class="kpis"><div class="kpi"><b>${cards.length}</b>Total tickets</div><div class="kpi"><b>${o.length}</b>Open tickets</div><div class="kpi"><b>${o.filter(c=>c.priority==='Critical').length}</b>Critical open</div><div class="kpi"><b>${o.filter(c=>c.type.includes('HyperCare')).length}</b>HyperCare open</div></div></section><section class="box"><div class="milestones">${ms.map(milestone).join('')}</div></section><section class="box"><h2>What kind of work remains?</h2><p class="sub">Ticket Type · open work only</p>${chips()}${bars(filtered.flatMap(c=>c.type).filter(x=>x!=='Missing'),'#ff2c8b')}<h3>Ticket Type by Milestone</h3><table class="heat"><tr><th>Milestone</th>${types.map(t=>`<th>${t}</th>`).join('')}</tr>${ms.map(m=>`<tr><th>${m}</th>${types.map(t=>`<td>${o.filter(c=>inM(c,m)&&c.type.includes(t)).length}</td>`).join('')}</tr>`).join('')}</table></section><div class="two"><section class="box"><h2>Tickets by Stream</h2><p class="sub">All active tickets</p>${bars(cards.flatMap(c=>c.stream.length?c.stream:['Missing']))}</section><section class="box"><h2>Tickets by Status</h2><p class="sub">Status follows Trello list order</p>${bars(cards.map(c=>c.status),'#ffd400')}</section></div><section class="box"><h2>Priority by Milestone</h2><p class="sub">Open work only</p><table class="heat"><tr><th>Milestone</th>${['Critical','High','Medium','Low','Missing'].map(p=>`<th>${p}</th>`).join('')}</tr>${ms.map(m=>`<tr><th>${m}</th>${['Critical','High','Medium','Low','Missing'].map(p=>`<td>${o.filter(c=>inM(c,m)&&c.priority===p).length}</td>`).join('')}</tr>`).join('')}</table></section><section class="box"><h2>Tickets Missing Details</h2><p class="sub">${missing.length} tickets require detail updates</p><table><tr><th>Ticket</th><th>Missing</th></tr>${missing.map(c=>{let a=[];if(!c.milestone.length)a.push('Milestone');if(!c.stream.length)a.push('Stream');if(c.type.includes('Missing'))a.push('Type');if(c.priority==='Missing')a.push('Priority');if(!c.owners.length)a.push('Owner');return`<tr><td><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a></td><td>${a.join(', ')}</td></tr>`}).join('')}</table></section>`}
async function load(){try{const url=DATA_URL+'?v='+Date.now();const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}: ${r.statusText}`);const d=await r.json();cards=mapData(d);document.getElementById('updated').textContent='JSON connected · '+cards.length+' tickets';render()}catch(e){document.getElementById('updated').textContent='JSON connection failed';document.getElementById('app').innerHTML=`<section class="box error"><h2>JSON could not be loaded</h2><p class="sub">Expected URL: <code>${location.origin}${location.pathname.replace(/[^/]*$/,'')}current-board.json</code></p><p><b>${esc(e.message)}</b></p><p>Confirm the file is named exactly <b>current-board.json</b>, is beside <b>index.html</b>, and both files are committed to the branch configured in Settings → Pages.</p></section>`}}load();
</script></body></html>
