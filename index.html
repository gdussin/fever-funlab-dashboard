<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fever × Funlab Product Roadmap</title>
<style>
:root{--ink:#111;--paper:#f6f1e8;--white:#fff;--pink:#ff2f92;--lime:#c8ff00;--yellow:#ffd400;--blue:#2457ff;--red:#ef3340;--muted:#6b6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Arial,sans-serif}.wrap{max-width:1440px;margin:auto;padding:24px}.hero{background:#111;color:#fff;padding:30px;border-radius:22px;display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{color:var(--lime);font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(34px,5vw,68px);line-height:.95;margin:10px 0}.hero p{margin:0;color:#ddd}.btn{border:2px solid #fff;background:var(--lime);color:#111;padding:11px 16px;border-radius:999px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:16px}.box{grid-column:span 12;background:#fff;border:2px solid #111;border-radius:18px;padding:20px;box-shadow:5px 5px 0 #111}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{padding:18px;border:2px solid #111;border-radius:14px;background:#fff}.kpi b{font-size:34px;display:block}.milestones{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.milestone{border:2px solid #111;border-radius:18px;padding:20px;background:#fff}.milestone h2{font-size:30px;margin:0}.risk{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:900;margin:8px 0}.low{background:var(--lime)}.watch{background:var(--yellow)}.high{background:var(--pink);color:#fff}.progress{height:16px;background:#eee;border:2px solid #111;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.mini div{background:#f4f4f4;border-radius:10px;padding:9px;text-align:center}.mini b{font-size:20px;display:block}.head{display:flex;align-items:center;justify-content:space-between;gap:14px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.chip{border:2px solid #111;background:#fff;border-radius:999px;padding:8px 13px;font-weight:900;cursor:pointer}.chip.on{background:#111;color:#fff}.chart{display:grid;gap:8px}.bar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 44px;align-items:center;gap:10px}.track{height:20px;background:#eee;border:1px solid #111;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse}th,td{border:1px solid #111;padding:10px;text-align:left}th{background:#111;color:#fff}.heat td{text-align:center;font-weight:900}.two{grid-column:span 6}.muted{color:var(--muted)}a{color:var(--blue)}details{margin-top:10px}.status{padding:10px 0;color:var(--muted)}
@media(max-width:900px){.kpis,.milestones{grid-template-columns:1fr 1fr}.two{grid-column:span 12}.mini{grid-template-columns:1fr 1fr}}@media(max-width:620px){.wrap{padding:12px}.hero{align-items:start;flex-direction:column}.kpis,.milestones{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 34px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><div><div class="eyebrow">FUNLAB × FEVER</div><h1>PRODUCT<br>ROADMAP</h1><p>Delivery readiness · risk · work mix</p></div><div><button class="btn" onclick="loadData()">Refresh data</button><div id="updated" class="status">Loading…</div></div></section>
<div id="app"><section class="box" style="margin-top:16px">Loading current-board.json…</section></div>
</main>
<script>
const DATA_URL='./current-board.json';
const DONE=['5. Live','6. Verified & Communicated'];
const ORDER=['1. Incoming','2. To Review','3. Backlog','4. In Progress','5. Live','6. Verified & Communicated'];
const WEIGHT={'1. Incoming':0,'2. To Review':10,'3. Backlog':25,'4. In Progress':60,'5. Live':90,'6. Verified & Communicated':100};
let cards=[],streamSel=[],statusSel=[],typeSel=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function labelValues(card,prefix){return (card.labels||[]).map(x=>x.name||'').filter(x=>x.startsWith(prefix+' |')).map(x=>x.split('|').slice(1).join('|').trim())}
function typeName(v){v=String(v||'').trim();if(/hyper.?care/i.test(v))return'HyperCare';if(/^bug$/i.test(v))return'Bug';if(/feature/i.test(v))return'Feature';if(/optimi[sz]ation/i.test(v))return'Optimization';return v||'Missing'}
function types(c){let a=labelValues(c,'T').map(typeName);return a.length?[...new Set(a)]:['Missing']}
function priority(c){let found='';for(const p of c.pluginData||[]){try{let v=JSON.parse(p.value||'{}');let s=JSON.stringify(v);let m=s.match(/Critical|High|Medium|Low/i);if(m)found=m[0][0].toUpperCase()+m[0].slice(1).toLowerCase()}catch(e){}}return found||'Missing'}
function mapData(d){let lists=Object.fromEntries((d.lists||[]).map(x=>[x.id,x.name]));return(d.cards||[]).filter(c=>!c.closed).map(c=>({raw:c,name:c.name,url:c.url||c.shortUrl||'#',status:lists[c.idList]||'Unknown',milestone:labelValues(c,'M'),stream:labelValues(c,'S'),type:types(c),priority:priority(c),last:new Date(c.dateLastActivity||0),members:c.idMembers||[]}))}
function isBAU(c){return !c.milestone.length}function inMilestone(c,m){return m==='BAU'?isBAU(c):c.milestone.includes(m)}function open(c){return !DONE.includes(c.status)}
function stale(c){return open(c)&&((Date.now()-c.last)/86400000>14)}
function toggle(kind,val){let a=kind==='stream'?streamSel:kind==='status'?statusSel:typeSel;if(val==='All')a.length=0;else{let i=a.indexOf(val);i<0?a.push(val):a.splice(i,1)}render()}
function chips(kind,values,selected){return`<div class="chips">${['All',...values].map(v=>`<button class="chip ${(v==='All'&&!selected.length)||selected.includes(v)?'on':''}" onclick="toggle('${kind}','${esc(v)}')">${esc(v)}</button>`).join('')}</div>`}
function bars(items,color='#2457ff'){let counts={};items.forEach(x=>counts[x]=(counts[x]||0)+1);let rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...rows.map(x=>x[1]));return`<div class="chart">${rows.map(([k,v])=>`<div class="bar"><b>${esc(k)}</b><div class="track"><div class="fill" style="width:${v/max*100}%;background:${color}"></div></div><b>${v}</b></div>`).join('')||'<p class="muted">No matching tickets.</p>'}</div>`}
function milestoneCard(m){let a=cards.filter(c=>inMilestone(c,m)),remain=a.filter(open),crit=remain.filter(c=>c.priority==='Critical').length,st=remain.filter(stale).length,hc=remain.filter(c=>c.type.includes('HyperCare')).length,progress=a.length?Math.round(a.reduce((n,c)=>n+(WEIGHT[c.status]??0),0)/a.length):0,risk=crit>=8||st>=8?'HIGH RISK':crit>=3||st>=3?'WATCH':'LOW RISK',cls=risk==='HIGH RISK'?'high':risk==='WATCH'?'watch':'low';return`<article class="milestone"><h2>${m}</h2><span class="risk ${cls}">${risk}</span><h3>${progress}% progress</h3><div class="progress"><i style="width:${progress}%"></i></div><div class="mini"><div><b>${remain.length}</b>Remaining</div><div><b>${crit}</b>Critical</div><div><b>${st}</b>Stale</div><div><b>${hc}</b>HyperCare</div></div></article>`}
function render(){let openCards=cards.filter(open),milestones=['AU','USA','BAU'];let typeNames=['HyperCare','Bug','Feature','Optimization','Missing'];let filteredTypes=openCards.filter(c=>!typeSel.length||c.type.some(t=>typeSel.includes(t)));let streams=[...new Set(cards.flatMap(c=>c.stream))].sort();let streamCards=cards.filter(c=>!streamSel.length||c.milestone.some(m=>streamSel.includes(m))||(streamSel.includes('BAU')&&isBAU(c)));let statusCards=cards.filter(c=>!statusSel.length||c.milestone.some(m=>statusSel.includes(m))||(statusSel.includes('BAU')&&isBAU(c)));let missing=cards.filter(c=>!c.milestone.length||!c.stream.length||c.type.includes('Missing')||c.priority==='Missing'||!c.members.length);
let matrix=`<table class="heat"><tr><th>Milestone</th>${typeNames.slice(0,4).map(t=>`<th>${t}</th>`).join('')}</tr>${milestones.map(m=>`<tr><th>${m}</th>${typeNames.slice(0,4).map((t,i)=>{let n=openCards.filter(c=>inMilestone(c,m)&&c.type.includes(t)).length,colors=['#ff2f92','#ef3340','#2457ff','#c8ff00'];return`<td style="background:${colors[i]};color:${i===3?'#111':'#fff'}">${n}</td>`}).join('')}</tr>`).join('')}</table>`;
document.getElementById('app').innerHTML=`
<section class="box"><div class="kpis"><div class="kpi"><b>${cards.length}</b>Active tickets</div><div class="kpi"><b>${openCards.length}</b>Remaining</div><div class="kpi"><b>${openCards.filter(c=>c.priority==='Critical').length}</b>Critical open</div><div class="kpi"><b>${openCards.filter(c=>c.type.includes('HyperCare')).length}</b>HyperCare open</div></div></section>
<section class="box"><div class="milestones">${milestones.map(milestoneCard).join('')}</div></section>
<section class="box"><div class="head"><div><h2>What kind of work remains?</h2><p class="muted">Ticket Type is read from Trello labels prefixed T |</p></div></div>${chips('type',typeNames,typeSel)}${bars(filteredTypes.flatMap(c=>c.type),'#ff2f92')}<h3>Ticket Type by milestone</h3>${matrix}</section>
<div class="grid"><section class="box two"><h2>Tickets by Stream</h2>${chips('stream',milestones,streamSel)}${bars(streamCards.flatMap(c=>c.stream.length?c.stream:['Missing']))}</section><section class="box two"><h2>Tickets by Status</h2>${chips('status',milestones,statusSel)}${bars(ORDER.flatMap(s=>Array(statusCards.filter(c=>c.status===s).length).fill(s)),'#ffd400')}</section></div>
<section class="box"><h2>Priority risk heatmap</h2><table class="heat"><tr><th>Milestone</th>${['Critical','High','Medium','Low','Missing'].map(x=>`<th>${x}</th>`).join('')}</tr>${milestones.map(m=>`<tr><th>${m}</th>${['Critical','High','Medium','Low','Missing'].map(p=>`<td>${openCards.filter(c=>inMilestone(c,m)&&c.priority===p).length}</td>`).join('')}</tr>`).join('')}</table></section>
<section class="box"><h2>Stale tickets</h2><details><summary>${openCards.filter(stale).length} tickets inactive for more than 14 days</summary><table><tr><th>Ticket</th><th>Milestone</th><th>Type</th><th>Status</th></tr>${openCards.filter(stale).sort((a,b)=>a.last-b.last).map(c=>`<tr><td><a href="${esc(c.url)}" target="_blank">${esc(c.name)}</a></td><td>${esc(c.milestone.join(', ')||'BAU')}</td><td>${esc(c.type.join(', '))}</td><td>${esc(c.status)}</td></tr>`).join('')}</table></details></section>
<section class="box"><h2>Missing details</h2><details><summary>${missing.length} tickets need remediation</summary><table><tr><th>Ticket</th><th>Missing</th></tr>${missing.map(c=>{let x=[];if(!c.milestone.length)x.push('Milestone');if(!c.stream.length)x.push('Stream');if(c.type.includes('Missing'))x.push('Type');if(c.priority==='Missing')x.push('Priority');if(!c.members.length)x.push('Owner');return`<tr><td><a href="${esc(c.url)}" target="_blank">${esc(c.name)}</a></td><td>${x.join(', ')}</td></tr>`}).join('')}</table></details></section>`}
async function loadData(){document.getElementById('updated').textContent='Refreshing…';try{let r=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status+' '+r.statusText);let d=await r.json();cards=mapData(d);document.getElementById('updated').textContent='Last updated: '+new Date(d.dateLastActivity||Date.now()).toLocaleString('en-AU');render()}catch(e){document.getElementById('app').innerHTML=`<section class="box"><h2>Data could not be loaded</h2><p>Confirm <b>current-board.json</b> sits beside this HTML file in GitHub.</p><code>${esc(e.message)}</code></section>`;document.getElementById('updated').textContent='Refresh failed'}}
loadData();
</script></body></html>
