<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fever × Funlab Delivery Readiness</title><style>
:root{--ink:#111111;--paper:#fffdf6;--pink:#ff2f92;--lime:#c8ff00;--yellow:#ffd400;--blue:#2457ff;--purple:#7b2cff;--red:#ef3340;--green:#00a878;--line:#171717;--muted:#5e5e5e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Arial,Helvetica,sans-serif;background-image:radial-gradient(circle at 8% 8%,#ff2f9214 0 90px,transparent 92px),radial-gradient(circle at 92% 18%,#c8ff0024 0 130px,transparent 132px)}.wrap{max-width:1460px;margin:auto;padding:24px}.hero{position:relative;overflow:hidden;background:var(--ink);color:#fff;padding:30px 32px;border:3px solid var(--ink);border-radius:24px;display:flex;justify-content:space-between;gap:20px;box-shadow:8px 8px 0 var(--pink)}.hero:after{content:"FOR THE FUN OF IT.";position:absolute;right:-18px;bottom:-12px;font-size:42px;font-weight:1000;color:#ffffff14;letter-spacing:-2px;transform:rotate(-4deg)}.eyebrow{display:inline-block;background:var(--lime);color:var(--ink);padding:5px 10px;border-radius:99px;font-weight:1000;letter-spacing:1.6px;font-size:12px}.hero h1{margin:10px 0 5px;font-size:36px;line-height:1;letter-spacing:-1.5px;text-transform:uppercase}.muted{color:var(--muted)}.hero .muted{color:#f3f3f3}.btn{position:relative;z-index:2;background:var(--yellow);color:var(--ink);border:2px solid #fff;padding:10px 14px;border-radius:99px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--pink)}.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--pink)}.summary,.cards,.grid{display:grid;gap:16px;margin-top:18px}.summary{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}.box{background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px;box-shadow:5px 5px 0 #111}.metric:nth-child(1){background:var(--lime)}.metric:nth-child(2){background:#fff}.metric:nth-child(3){background:#ffd9e9}.metric:nth-child(4){background:#fff2a8}.metric b{font-size:34px;line-height:1;display:block;font-weight:1000}.mile{border-top:12px solid var(--pink)}.mile:nth-child(2){border-top-color:var(--blue)}.mile.bau{border-top-color:var(--lime)}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.head h2,.head h3{margin:0;font-weight:1000;letter-spacing:-.4px}.risk,.pill{padding:6px 10px;border:2px solid var(--ink);border-radius:99px;font-size:11px;font-weight:1000;background:#fff}.low{background:var(--lime);color:var(--ink)}.watch{background:var(--yellow);color:var(--ink)}.high{background:var(--pink);color:#fff}.score{font-size:44px;font-weight:1000;margin-top:12px;letter-spacing:-2px}.progress,.track{height:17px;background:#eee;border:2px solid var(--ink);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--lime))}.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.mini div{background:#f7f7f7;border:1.5px solid var(--ink);border-radius:12px;padding:9px}.mini b{font-size:20px;display:block;font-weight:1000}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.chip{border:2px solid var(--ink);background:#fff;padding:7px 13px;border-radius:99px;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}.chip.on{background:var(--pink);color:#fff}.chip:hover{transform:translateY(-1px)}.bar{display:grid;grid-template-columns:165px 1fr 38px;gap:9px;align-items:center;margin:11px 0}.fill{height:100%;border-radius:99px}.heat{overflow:auto}.heat table{width:100%;border-spacing:7px}.heat th{color:var(--muted);font-size:11px;text-transform:uppercase}.heat td{text-align:center;padding:16px;border:2px solid var(--ink);border-radius:10px;font-weight:1000}.data{width:100%;border-collapse:collapse}.data th,.data td{text-align:left;padding:11px;border-bottom:1.5px solid var(--ink)}.data th{text-transform:uppercase;font-size:11px}a{color:var(--blue);font-weight:900;text-decoration-thickness:2px}.issue{border:2px solid var(--ink);border-radius:12px;margin:10px 0;overflow:hidden}.issue summary{padding:14px;font-weight:1000;cursor:pointer;display:flex;justify-content:space-between;background:#fafafa}.issue div{padding:9px 14px;border-top:1.5px solid var(--ink)}.notice{display:none;background:var(--yellow);border:2px solid var(--ink);padding:12px;border-radius:10px;margin-top:14px;box-shadow:4px 4px 0 var(--ink)}@media(max-width:900px){.summary{grid-template-columns:1fr 1fr}.cards,.grid{grid-template-columns:1fr}.mini{grid-template-columns:1fr 1fr}.hero{display:block}.hero>div:last-child{margin-top:18px}.hero h1{font-size:29px}}
</style></head><body><main class="wrap"><section class="hero"><div><div class="eyebrow">FUNLAB × FEVER</div><h1>Delivery Readiness — For the fun of it.</h1><div id="subtitle" class="muted">Loading current board…</div><div id="updated" style="margin-top:8px">Last updated: loading…</div></div><div><button class="btn" onclick="load()">Refresh data</button></div></section><div id="notice" class="notice"></div><div id="app"></div></main><script>
const URL='https://azurefunlab.sharepoint.com/sites/FeverxFunlab/Shared%20Documents/Administration/Project%20Management/Roadmap/Board/current-board.json';const DONE=['5. Live','6. Verified & Communicated'],W={'1. Incoming':0,'2. To Review':10,'3. Backlog':25,'4. In Progress':60,'5. Live':90,'6. Verified & Communicated':100},COL=['#ff2f92','#2457ff','#ffd400','#7b2cff','#00a878','#c8ff00'];let D,C=[],ORDER=[],ss=[],ts=[];const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function labels(c,p){return(c.labels||[]).map(x=>(x.name||'').match(new RegExp('^'+p+'\\s*[|:]\\s*(.+)$','i'))).filter(Boolean).map(x=>x[1].trim())}function priority(c){for(const x of c.pluginData||[]){try{let z=JSON.parse(x.value||'{}');if(z.priority)return z.priority[0].toUpperCase()+z.priority.slice(1)}catch{}}return'Missing'}
function prep(d){D=d;let L=Object.fromEntries((d.lists||[]).map(x=>[x.id,x.name]));ORDER=(d.lists||[]).filter(x=>!x.closed).map(x=>x.name);let moves={};for(const a of d.actions||[])if(a.type==='updateCard'&&a.data?.listAfter&&!moves[a.data?.card?.id])moves[a.data.card.id]=a.date;let snap=new Date(d.dateLastActivity||Date.now());C=(d.cards||[]).filter(c=>!c.closed&&!c.isTemplate).map(c=>({name:c.name,url:c.url||c.shortUrl,status:L[c.idList]||'Unknown',m:labels(c,'M'),s:labels(c,'S'),priority:priority(c),owners:c.idMembers||[],age:moves[c.id]?Math.floor((snap-new Date(moves[c.id]))/86400000):null}));render()}
const bau=c=>!c.m.length||c.m.some(x=>/BAU/i.test(x)),stale=c=>['3. Backlog','4. In Progress'].includes(c.status)&&c.age>=14,ms=()=>[...new Set(C.flatMap(c=>c.m).filter(x=>!/BAU/i.test(x)))].sort();function match(c,a){return!a.length||a.some(x=>x==='BAU'?bau(c):c.m.includes(x))}function toggle(k,v){let a=k==='s'?ss:ts;if(v==='All')a.splice(0);else{let i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)}render()}function chips(k,a){return'<div class="chips">'+['All',...ms(),'BAU'].map(x=>`<button class="chip ${(x==='All'&&!a.length)||a.includes(x)?'on':''}" onclick="toggle('${k}','${esc(x)}')">${esc(x)}</button>`).join('')+'</div>'}function bars(a,ord){let ks=ord?ord.filter(x=>a.includes(x)):[...new Set(a)].sort(),mx=Math.max(1,...ks.map(k=>a.filter(x=>x===k).length));return ks.map((k,i)=>{let n=a.filter(x=>x===k).length;return`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${100*n/mx}%;background:${COL[i%COL.length]}"></div></div><b>${n}</b></div>`}).join('')}
function card(n,a,b=false){let prog=Math.round(a.reduce((z,c)=>z+(W[c.status]??0),0)/Math.max(1,a.length)),rem=a.filter(c=>!DONE.includes(c.status)).length,crit=a.filter(c=>c.priority==='Critical'&&!DONE.includes(c.status)).length,st=a.filter(stale).length,r=crit>=8||st>=8?'HIGH RISK':crit>=3||st>=3?'WATCH':'LOW RISK',cl=r==='HIGH RISK'?'high':r==='WATCH'?'watch':'low';return`<article class="box mile ${b?'bau':''}"><div class="head"><h3>${esc(n)}</h3><span class="risk ${cl}">${r}</span></div><div class="score">${prog}%</div><div class="muted">status-weighted progress</div><div class="progress"><i style="width:${prog}%"></i></div><div class="mini"><div><b>${a.length}</b>Total</div><div><b>${rem}</b>Remaining</div><div><b>${crit}</b>Critical open</div><div><b>${st}</b>Stale</div></div></article>`}
function render(){let complete=C.filter(c=>DONE.includes(c.status)).length,crit=C.filter(c=>c.priority==='Critical'&&!DONE.includes(c.status)).length,st=C.filter(stale).sort((a,b)=>b.age-a.age),mil=ms(),rows=[...mil,'BAU'],ps=['Critical','High','Medium','Low','Missing'],open=C.filter(c=>!DONE.includes(c.status)),mat=rows.map(r=>ps.map(p=>open.filter(c=>(r==='BAU'?bau(c):c.m.includes(r))&&c.priority===p).length)),mx=Math.max(1,...mat.flat());document.getElementById('subtitle').textContent=(D.name||'Trello board')+' · '+C.length+' active tickets';document.getElementById('updated').textContent='Last updated: '+new Date(D.dateLastActivity||Date.now()).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});let checks=[['Missing Milestone',c=>!c.m.length],['Missing Stream',c=>!c.s.length],['Missing Priority',c=>c.priority==='Missing'],['Missing Owner',c=>!c.owners.length]];app.innerHTML=`<section class="summary"><div class="box metric"><b>${C.length}</b><span>Active tickets</span></div><div class="box metric"><b>${C.length-complete}</b><span>Remaining</span></div><div class="box metric"><b>${crit}</b><span>Critical open</span></div><div class="box metric"><b>${st.length}</b><span>Known stale</span></div></section><section class="cards">${mil.map(m=>card(m,C.filter(c=>c.m.includes(m)))).join('')}${card('BAU Operations',C.filter(bau),true)}</section><div class="grid"><section class="box"><h2>Where is the work?</h2><p class="muted">Select one or more milestones.</p>${chips('s',ss)}${bars(C.filter(c=>match(c,ss)).flatMap(c=>c.s.length?c.s:['Missing']))}</section><section class="box"><h2>Where is the work in the process?</h2><p class="muted">Status follows Trello list order.</p>${chips('t',ts)}${bars(C.filter(c=>match(c,ts)).map(c=>c.status),ORDER)}</section></div><section class="box" style="margin-top:16px"><h2>Delivery risk by milestone</h2><p class="muted">Open work only · milestone × priority.</p><div class="heat"><table><tr><th></th>${ps.map(p=>`<th>${p}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr><th>${r}</th>${ps.map((p,j)=>{let n=mat[i][j],a=.12+.78*n/mx,col=p==='Critical'?`rgba(255,47,146,${a})`:p==='High'?`rgba(255,212,0,${a})`:`rgba(36,87,255,${a})`;return`<td style="background:${col}">${n}</td>`}).join('')}</tr>`).join('')}</table></div></section><section class="box" style="margin-top:16px"><div class="head"><h2>Work needing attention</h2><span class="pill watch">${st.length} stale</span></div><table class="data"><tr><th>Ticket</th><th>Milestone</th><th>Status</th><th>Priority</th><th>Days</th></tr>${st.map(c=>`<tr><td><a href="${esc(c.url)}" target="_blank">${esc(c.name)}</a></td><td>${esc(c.m.join(', ')||'BAU')}</td><td>${esc(c.status)}</td><td>${esc(c.priority)}</td><td>${c.age}</td></tr>`).join('')}</table></section><section class="box" style="margin-top:16px"><h2>Data quality actions</h2><p class="muted">Open affected cards directly in Trello.</p>${checks.map(([n,f])=>{let a=C.filter(f);return`<details class="issue"><summary><span>${n}</span><span class="pill">${a.length}</span></summary>${a.map(c=>`<div><a href="${esc(c.url)}" target="_blank">${esc(c.name)}</a><a href="${esc(c.url)}" target="_blank" style="float:right">Open in Trello ↗</a></div>`).join('')}</details>`}).join('')}</section>`}
async function load(){notice.style.display='none';try{let r=await fetch(URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);prep(await r.json())}catch(e){notice.textContent='The permanent SharePoint JSON endpoint could not be loaded. Confirm you are signed in to SharePoint and have access to current-board.json, then select Refresh data.';notice.style.display='block'}}load();
</script></body></html>
